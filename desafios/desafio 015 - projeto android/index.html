<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projeto Android</title>
    <link rel="stylesheet" href="estilos/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=account_box" />
</head>

<body>
    <main>
        <section>
            <div id="imagem">              <!--Imagem-->
                <img src="imagens/cidade.jpg" alt="cidade">
            </div>

            <div id="form">         <!--Formulário - Login-->
                <h1>Login</h1>
                <p>Seja bem-vindo(a) novamente. Faça login para acessar sua conta e poder fazer as configurações no seu
                    ambiente.</p>
                <form action="login.php" autocomplete="on">

                    <!--Campo de E-mail-->
                    <label for="iemail"></label>
                    
                    <div class="borda-login">
                        <input type="email" name="e-mail" id="iemail" autocomplete="email" required placeholder="seu e-mail" class="login">
                    </div>
                    

                    <!--Campo de senha-->
                    <div class="borda-login">
                        <label for="isenha"></label>
                        <input type="password" name="senha" id="isenha" required min="8" placeholder="sua senha" class="login">
                    </div>

                    <!--Botões Entrar e de Senha-->
                    <input type="submit" value="Entrar" class="botao">
                    <input type="submit" value="Esqueci a senha" class="botao" id="esqueci" >
                    
                </form>

            </div>
        </section>
    </main>

</body>

</html>
