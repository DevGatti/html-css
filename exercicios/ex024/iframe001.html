<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        iframe {
            width: 500px;
            height: 400px;
            border: 1px solid black;
            box-shadow: 3px 5px 5px black;
        }

    </style>
</head>

<body>
    <h1>Testando o uso de iframe</h1>
    <p>
        Acessando o site do

        <iframe src="https://cursoemvideo.com" width="400px" height="300px" frameborder="0" scolling="no"></iframe>
        <a href="https://cursoemvideo.com" target="_blank">Curso em Vídeo</a>

        para aprender a programar
    </p>

    <p>
        O repositório do Guanabara no

        <iframe src="https://gustavoguanabara.github.io" frameborder="0"></iframe>
        <a href="https://gustavoguanabara.github.io">GitHub</a>

        também é bem legal!
    </p>

</body>

</html>
