<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
    <style>
        body {
            max-width: 1000px;
            margin: auto;
        }

        iframe {
            display: block;
        }

        iframe:hover {
            transform: rotate3d(1, 0, 0, 360deg);
            transition: 1s;
        }
    </style>
</head>
<body>
