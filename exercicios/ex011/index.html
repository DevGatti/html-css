<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>

<body>
    <h1>Imagem dinâmica</h1>
    <p>Tente abrir esse site em vários dispositivos diferentes ou simplesmente aumente e diminua o tamanho do navegador
    </p>

    <picture>
        <source media="(max-width: 750px)" srcset="imagens/foto-p.png" type="image/png"><!--pequena-->

        <source media="(max-width: 1050px)" srcset="imagens/foto-m.png" type="image/png"><!--media-->

        <img src="imagens/foto-g.png" alt="Imagem flexível"><!--grande-->
    </picture>

    <h1>Reproduzindo Áudio</h1>
    <p>Vamos aprender a repoduzir áudio</p>
    <audio preload="metadata" controls>
        <source src="midia/My Heart Beats For You.mp3" type="audio/mpeg">
        <source src="midia/My Heart Beats For You.ogg" type="audio/ogg">
        <source src="midia/My Heart Beats For You.wav" type="audio/wav">
    </audio>

</body>

</html>
